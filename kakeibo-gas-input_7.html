body{font-family:'Noto Sans JP',sans-serif;background:var(--ink);color:var(--paper);min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

.input-tab.active{background:var(--paper);color:var(--ink);font-weight:500}
.input-panel{background:rgba(255,255,255,0.04);border-radius:16px;padding:18px;display:none}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-field label{display:block;font-size:10px;color:var(--text-soft);margin-bottom:5px}
.form-field input,.form-field select{width:100%;background:var(--paper);color:var(--ink);border:none;border-radius:8px;padding:10px 12px;font-family:'Noto Sans JP',sans-serif;font-size:13px;outline:none}
.type-toggle{display:flex;gap:8px;margin-bottom:14px}
.type-btn{flex:1;padding:10px;border-radius:8px;border:2px solid transparent;background:var(--paper);color:var(--text-soft);font-family:inherit;font-size:13px;cursor:pointer}
.type-btn.expense.active{border-color:var(--vermillion);color:var(--vermillion);font-weight:700}
.type-btn.income.active{border-color:var(--celadon);color:var(--celadon);font-weight:700}
.btn-submit{width:100%;margin-top:6px;padding:13px;border:none;border-radius:10px;background:var(--gold);color:var(--ink);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.upload-zone{border:1.5px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;cursor:pointer;position:relative;color:var(--text-soft);background:rgba(255,255,255,0.02)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-zone .icon{font-size:28px;margin-bottom:8px}
.upload-zone h3{font-size:13px;color:var(--paper);margin-bottom:4px}
.upload-zone p{font-size:11px}
select.csv-bank{width:100%;background:var(--paper);color:var(--ink);border:none;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px;font-family:inherit}

<script>

function init(){
  document.getElementById('mDate').value=new Date().toISOString().slice(0,10);
  updateCategoryOptions();
  populatePaymentMethods();
}

function updateCategoryOptions(){
  document.getElementById('mCategory').innerHTML=CATEGORIES[manualType].map(function(c){return '<option>'+c+'</option>';}).join('');

function populatePaymentMethods(){

function setManualType(type){
  manualType=type;

function switchTab(btn){
  document.querySelectorAll('.input-tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.input-panel').forEach(function(p){p.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('panel-'+btn.dataset.panel).classList.add('active');
}

function sendToSheet(entries){
  return new Promise(function(resolve,reject){
    var cb='gasCallback_'+Date.now();
    var s=document.createElement('script');
    var timer=setTimeout(function(){
      delete window[cb];
      if(s.parentNode)s.parentNode.removeChild(s);
      reject(new Error('タイムアウト（30秒）。処理は裏側で続いている可能性があるので、少し待ってからスプレッドシートを確認してください。'));
    },30000);
    window[cb]=function(data){
      clearTimeout(timer);
      delete window[cb];
      if(s.parentNode)s.parentNode.removeChild(s);
      if(data&&data.success){resolve(data);}
      else{reject(new Error((data&&data.message)||'保存失敗'));}
    };
    s.src=GAS_URL+'?entries='+encodeURIComponent(JSON.stringify(entries))+'&callback='+cb;
    s.onerror=function(){
      clearTimeout(timer);
      delete window[cb];
      if(s.parentNode)s.parentNode.removeChild(s);
      reject(new Error('通信エラー'));
    };
    document.body.appendChild(s);
  });
}

function analyzeByFileId(fileId){
  return new Promise(function(resolve,reject){
    var cb='visionCallback_'+Date.now();
    var s=document.createElement('script');
    var timer=setTimeout(function(){
      delete window[cb];
      if(s.parentNode)s.parentNode.removeChild(s);
      reject(new Error('タイムアウト（180秒）。画像が大きい、複数枚同時解析中、またはGemini側が混雑している可能性があります。もう一度試してください。'));
    },180000);
    window[cb]=function(data){
      clearTimeout(timer);
      delete window[cb];
      if(s.parentNode)s.parentNode.removeChild(s);
      if(data&&data.success){resolve(data);}
      else{reject(new Error((data&&data.message)||'解析失敗'));}
    };
    s.src=GAS_URL+'?fileId='+encodeURIComponent(fileId)+'&callback='+cb;
    s.onerror=function(){
      clearTimeout(timer);
      delete window[cb];
      if(s.parentNode)s.parentNode.removeChild(s);
      reject(new Error('通信エラー'));
    };
    document.body.appendChild(s);
  });
}

function openDrivePicker(){
  if(typeof google==='undefined'||!google.accounts||!google.accounts.oauth2){
    alert('Googleライブラリがまだ読み込まれていません。数秒待ってから再度クリックしてください。');
    return;
  }
  pickerCallbackDone=false;
  if(!accessToken){
    var client=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,
      scope:'https://www.googleapis.com/auth/drive.readonly',
      callback:function(t){accessToken=t.access_token;showPicker();}
    });
    client.requestAccessToken();
  }else{showPicker();}
}

function showPicker(){
  if(!pickerInited){
    gapi.load('picker',function(){
      pickerInited=true;
      buildAndShowPicker();
    });
    return;
  }
  buildAndShowPicker();
}

var currentPicker=null;

function buildAndShowPicker(){
  var view=new google.picker.View(google.picker.ViewId.DOCS_IMAGES);
  view.setParent(DRIVE_FOLDER_ID);
  currentPicker=new google.picker.PickerBuilder()
    .setTitle('家計簿スクショを選択（複数選択可）')
    .addView(view)
    .setOAuthToken(accessToken)
    .setDeveloperKey(GOOGLE_API_KEY)
    .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
    .setCallback(pickerCallback)
    .build();
  currentPicker.setVisible(true);
}

var pickerCallbackDone=false;

function pickerCallback(data){
  if(pickerCallbackDone)return;
  try{
    var action=data[google.picker.Response.ACTION];
    if(action===google.picker.Action.PICKED){
      pickerCallbackDone=true;
      if(currentPicker){currentPicker.setVisible(false);currentPicker=null;}
      var docs=data[google.picker.Response.DOCUMENTS]||[];
      docs.forEach(function(f){
        var id=f[google.picker.Document.ID];
        if(!selectedFiles.some(function(sf){return sf.id===id;})){
          selectedFiles.push({id:id,name:f[google.picker.Document.NAME]});
        }
      });
      photoFile=null;
      document.getElementById('photoInput').value='';
      renderSelectedFiles();
    } else if(action===google.picker.Action.CANCEL){
      if(currentPicker){currentPicker.setVisible(false);currentPicker=null;}
    }
  }catch(err){
    showError('photoError','Picker エラー: '+err.message);
  }
}

function renderSelectedFiles(){
  var box=document.getElementById('photoFileList');
  if(!selectedFiles.length){
    box.innerHTML='';
    if(!photoFile)document.getElementById('photoAnalyzeBtn').classList.remove('show');
    return;
  }
  box.innerHTML=selectedFiles.map(function(f,i){
    return '<div class="preview-row show">'+
      '<img class="thumb" id="thumb_'+f.id+'" alt="" onclick="openFullImage(\''+f.id+'\')">'+
      '<span>📎</span><span class="name">'+escapeHtml(f.name)+'</span>'+
      '<button onclick="removeSelectedFile('+i+')">✕</button></div>';
  }).join('');
  document.getElementById('photoAnalyzeBtn').classList.add('show');
  selectedFiles.forEach(function(f){
    loadPhotoImage(f.id).then(function(url){
      var img=document.getElementById('thumb_'+f.id);
      if(img){img.src=url;img.style.display='block';}

    });
  });
}

// GAS経由（JSONP）で元画像をdata URLとして取得し、サムネイル表示＆タップで原寸表示（別タブ）
// できるようにする。ブラウザから直接Drive APIをfetchするとCORSで失敗することがあるため、
// 既にVision解析で実績のあるGAS(DriveApp)経由の取得に統一している。
// これにより、Gemini/Vision側の読み取りミス（文字化けした銘柄名など）をユーザーが
// 元のスクショと見比べて確認・手直しできる。
function loadPhotoImage(id){
  if(photoImageUrls[id])return Promise.resolve(photoImageUrls[id]);
  return new Promise(function(resolve,reject){
    var cb='previewCallback_'+Date.now()+'_'+Math.floor(Math.random()*10000);
    var s=document.createElement('script');
    var timer=setTimeout(function(){
      delete window[cb];
      if(s.parentNode)s.parentNode.removeChild(s);
      reject(new Error('タイムアウト（30秒）'));
    },30000);
    window[cb]=function(data){
      clearTimeout(timer);
      delete window[cb];
      if(s.parentNode)s.parentNode.removeChild(s);
      if(data&&data.success&&data.dataUrl){
        photoImageUrls[id]=data.dataUrl;
        resolve(data.dataUrl);
      }else{
        reject(new Error((data&&data.message)||'画像取得失敗'));
      }
    };
    s.src=GAS_URL+'?previewFileId='+encodeURIComponent(id)+'&callback='+cb;
    s.onerror=function(){
      clearTimeout(timer);
      delete window[cb];
      if(s.parentNode)s.parentNode.removeChild(s);
      reject(new Error('通信エラー'));
    };
    document.body.appendChild(s);
  });
}

function openFullImage(id){
  loadPhotoImage(id).then(function(dataUrl){
    // data:URLへの直接ナビゲーション(window.open)はブラウザにブロックされる場合があるため、
    // 一度blobに変換してobject URLを開く
    return fetch(dataUrl).then(function(r){return r.blob();});
  }).then(function(blob){
    var url=URL.createObjectURL(blob);
    window.open(url,'_blank');
  }).catch(function(e){
    showError('photoError','画像を開けませんでした: '+e.message);
  });
}

function copyRawText(){

  };

  }
}

async function analyzePhoto(){
  if(!photoFile&&!selectedFiles.length){
    showError('photoError','ファイルが選択されていません');
    return;
  }
  if(!selectedFiles.length&&photoFile){
    // 直接アップロードはfileIdなしのため、まずDriveにアップロードしてからfileIdで解析
    showError('photoError','直接アップロードはドライブ経由のみ対応しています。「📂 家計簿スクショから選択」をご利用ください（複数選択も可能です）。');
    return;
  }
  document.getElementById('photoAnalyzeBtn').disabled=true;
  document.getElementById('photoError').classList.remove('show');
  document.getElementById('rawText').classList.remove('show');
  var total=selectedFiles.length;
  var loadingEl=document.getElementById('photoLoading');
  var completed=0;
  loadingEl.classList.add('show');
  loadingEl.innerHTML='<div class="spinner-sm"></div>GAS経由で解析中... (0/'+total+'件)';

  // Gemini/Vision APIが同時多重リクエストに弱く、並列実行すると詰まって
  // 全件タイムアウトすることがあるため、1枚ずつ順番に解析する
  var settled=[];
  for(var fi=0; fi<selectedFiles.length; fi++){
    var f=selectedFiles[fi];
    loadingEl.innerHTML='<div class="spinner-sm"></div>GAS経由で解析中... ('+completed+'/'+total+'件: '+escapeHtml(f.name)+')';
    try{
      var r=await analyzeByFileId(f.id);
      completed++;
      settled.push({status:'fulfilled',value:{file:f,result:r}});
    }catch(e){
      completed++;
      settled.push({status:'rejected',reason:e});
    }
    loadingEl.innerHTML='<div class="spinner-sm"></div>GAS経由で解析中... ('+completed+'/'+total+'件)';
  }

  loadingEl.classList.remove('show');

  var allEntries=[],allHoldings=[],allIdecoList=[],rawTexts=[],errors=[];
  settled.forEach(function(r,i){
    if(r.status==='fulfilled'){
      var data=r.value.result;
      var name=r.value.file.name;
      if(data.rawText)rawTexts.push('['+name+']\n'+data.rawText);
      var type=data.type||'transactions';
      if(type==='securities'){
        if(data.holdings&&data.holdings.length)allHoldings=allHoldings.concat(data.holdings);
        else errors.push(name+': 証券銘柄を検出できませんでした。');
      }else if(type==='ideco'){
        allIdecoList.push(data.ideco||{balance:0,contribution:0});
      }else if(type==='unknown'){
        errors.push(name+': 画面の種類を判定できませんでした。');
      }else{
        if(data.entries&&data.entries.length)allEntries=allEntries.concat(data.entries);
        else errors.push(name+': 明細を検出できませんでした。');
      }
    }else{
      errors.push(selectedFiles[i].name+': エラー ('+((r.reason&&r.reason.message)||'解析失敗')+')');
    }
  });

  if(rawTexts.length){
    document.getElementById('rawText').textContent='読み取ったテキスト:\n\n'+rawTexts.join('\n\n---\n\n');
    document.getElementById('rawText').classList.add('show');
    document.getElementById('rawTextCopyWrap').classList.add('show');
  }
  if(errors.length)showError('photoError',errors.join('\n'));
  if(allEntries.length){reviewData.photo=allEntries;renderReview('photo');}
  if(allHoldings.length){securitiesData=allHoldings;renderSecuritiesReview();}
  if(allIdecoList.length){idecoDataList=allIdecoList;renderIdecoReview();}

  document.getElementById('photoAnalyzeBtn').disabled=false;
}

async function analyzeCSV(){
  if(!csvFile)return;
  document.getElementById('csvAnalyzeBtn').disabled=true;
  document.getElementById('csvLoading').classList.add('show');
  document.getElementById('csvError').classList.remove('show');
  try{
    var text=await readCSVText(csvFile);
    var cb='csvCallback_'+Date.now();
    var result=await new Promise(function(resolve,reject){
      var s=document.createElement('script');
      var timer=setTimeout(function(){
        delete window[cb];
        if(s.parentNode)s.parentNode.removeChild(s);
        reject(new Error('タイムアウト（30秒）'));
      },30000);
      window[cb]=function(data){
        clearTimeout(timer);
        delete window[cb];
        if(s.parentNode)s.parentNode.removeChild(s);
        if(data&&data.success){resolve(data);}
        else{reject(new Error((data&&data.message)||'解析失敗'));}
      };
      var base64=btoa(unescape(encodeURIComponent(text)));
      s.src=GAS_URL+'?csv='+encodeURIComponent(base64)+'&callback='+cb;
      s.onerror=function(){
        clearTimeout(timer);
        delete window[cb];
        if(s.parentNode)s.parentNode.removeChild(s);
        reject(new Error('通信エラー'));
      };
      document.body.appendChild(s);
    });
    document.getElementById('csvLoading').classList.remove('show');
    reviewData.csv=result.entries||[];
    if(!reviewData.csv.length){showError('csvError','取引データが見つかりませんでした。');}
    else{renderReview('csv');}
  }catch(e){
    document.getElementById('csvLoading').classList.remove('show');
    showError('csvError','エラー: '+e.message);
  }
  document.getElementById('csvAnalyzeBtn').disabled=false;
}

function escapeHtml(str){

  d.textContent=str;
  return d.innerHTML;

function escapeAttr(str){
  return String(str).replace(/"/g,'&quot;');
}

function fileToBase64(file){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(){resolve(r.result.split(',')[1]);};
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

function readCSVText(file){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(e){resolve(e.target.result);};
    r.onerror=reject;
    r.readAsText(file,'Shift_JIS');
  });
}
