<style>
:root {
  --ink: #1c1b1f;
  --paper: #f7f3ea;
  --paper-dim: #ece6d8;
  --vermillion: #c8553d;
  --celadon: #5b8a72;
  --gold: #b8923f;
  --line: #d8cfb8;
  --text-soft: #6b6558;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--ink);
  color: var(--paper);
  min-height: 100vh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
header {
  padding: 26px 20px 18px;
  text-align: center;
  position: relative;
}
header::after {
  content: '';
  position: absolute; bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 48px; height: 1px;
  background: var(--gold);
}
.app-title {
  font-family: 'Shippori Mincho', serif;
  font-size: 21px; font-weight: 700;
  letter-spacing: 0.06em;
}
.app-title .stamp {
  display: inline-block; width: 26px; height: 26px;
  background: var(--vermillion); border-radius: 4px;
  color: white; font-size: 13px; line-height: 26px;
  margin-right: 8px; font-family: 'Shippori Mincho', serif;
}
header p { font-size: 11px; color: var(--text-soft); margin-top: 6px; }
.main {
  max-width: 680px; margin: 0 auto;
  padding: 20px 16px 60px;
  display: flex; flex-direction: column; gap: 18px;
}
.security-note {
  background: rgba(91,138,114,0.1);
  border: 1px solid rgba(91,138,114,0.3);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 11px; color: #a8c9b5;
  line-height: 1.6;
  display: flex; gap: 10px; align-items: flex-start;
}
.security-note .icon { font-size: 16px; flex-shrink: 0; }
.input-tabs {
  display: flex; gap: 8px;
  background: rgba(255,255,255,0.04);
  border-radius: 14px; padding: 5px;
}
.input-tab {
  flex: 1; background: none; border: none;
  padding: 10px; border-radius: 10px;
  color: var(--text-soft); font-family: inherit; font-size: 12px;
  cursor: pointer; transition: all 0.15s;
}
.input-tab.active { background: var(--paper); color: var(--ink); font-weight: 500; }
.input-panel {
  background: rgba(255,255,255,0.04);
  border-radius: 16px; padding: 18px;
  display: none;
}
.input-panel.active { display: block; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.form-field label { display: block; font-size: 10px; color: var(--text-soft); margin-bottom: 5px; letter-spacing: 0.06em; }
.form-field input, .form-field select {
  width: 100%; background: var(--paper); color: var(--ink);
  border: none; border-radius: 8px; padding: 10px 12px;
  font-family: 'Noto Sans JP', sans-serif; font-size: 13px; outline: none;
}
.type-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
.type-btn {
  flex: 1; padding: 10px; border-radius: 8px; border: 2px solid transparent;
  background: var(--paper); color: var(--text-soft);
  font-family: inherit; font-size: 13px; cursor: pointer; transition: all 0.15s;
}
.type-btn.expense.active { border-color: var(--vermillion); color: var(--vermillion); font-weight: 700; }
.type-btn.income.active { border-color: var(--celadon); color: var(--celadon); font-weight: 700; }
.btn-submit {
  width: 100%; margin-top: 6px;
  padding: 13px; border: none; border-radius: 10px;
  background: var(--gold); color: var(--ink);
  font-family: inherit; font-size: 13px; font-weight: 700;
  cursor: pointer; letter-spacing: 0.05em;
}
.btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
.upload-zone {
  border: 1.5px dashed var(--line); border-radius: 12px;
  padding: 26px 16px; text-align: center; cursor: pointer;
  position: relative; color: var(--text-soft);
  background: rgba(255,255,255,0.02); transition: all 0.2s;
}
.upload-zone:hover { border-color: var(--gold); background: rgba(184,146,63,0.05); }
.upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-zone .icon { font-size: 28px; margin-bottom: 8px; }
.upload-zone h3 { font-size: 13px; color: var(--paper); margin-bottom: 4px; }
.upload-zone p { font-size: 11px; }
select.csv-bank {
  width: 100%; background: var(--paper); color: var(--ink);
  border: none; border-radius: 8px; padding: 10px 12px;
  font-size: 13px; margin-bottom: 10px; font-family: inherit;
}
.preview-row {
  display: none; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.04); border-radius: 10px;
  padding: 10px 14px; margin-top: 10px; font-size: 12px;
}
.preview-row.show { display: flex; }
.preview-row .name { flex: 1; }
.preview-row button { background: none; border: none; color: var(--vermillion); cursor: pointer; font-size: 16px; }
.btn-analyze {
  width: 100%; margin-top: 10px; padding: 13px;
  border: none; border-radius: 10px;
  background: var(--gold); color: var(--ink);
  font-family: inherit; font-size: 13px; font-weight: 700;
  cursor: pointer; display: none;
}
.btn-analyze.show { display: block; }
.btn-analyze:disabled { opacity: 0.5; }
.btn-drive {
  width: 100%; margin-top: 10px; padding: 13px;
  border: none; border-radius: 10px;
  background: var(--celadon); color: white;
  font-family: inherit; font-size: 13px; font-weight: 700;
  cursor: pointer;
}
.loading-inline { display: none; text-align: center; padding: 16px; font-size: 12px; color: var(--text-soft); }
.loading-inline.show { display: block; }
.spinner-sm {
  width: 22px; height: 22px; border: 2px solid var(--line);
  border-top-color: var(--gold); border-radius: 50%;
  margin: 0 auto 8px; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.review-list { display: none; flex-direction: column; gap: 8px; margin-top: 10px; }
.review-list.show { display: flex; }
.review-item { background: var(--paper); color: var(--ink); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.review-item input, .review-item select { background: var(--paper-dim); border: none; border-radius: 6px; padding: 6px 8px; font-size: 12px; font-family: inherit; }
.review-item .desc-input { flex: 1; min-width: 90px; }
.review-item .amt-input { width: 75px; font-family: 'DM Mono', monospace; }
.review-item .remove-btn { background: none; border: none; color: var(--vermillion); cursor: pointer; font-size: 15px; padding: 2px; }
.btn-confirm-all {
  width: 100%; margin-top: 10px; padding: 12px;
  border: none; border-radius: 10px;
  background: var(--celadon); color: white;
  font-family: inherit; font-size: 13px; font-weight: 700;
  cursor: pointer; display: none;
}
.btn-confirm-all.show { display: block; }
.btn-confirm-all:disabled { opacity: 0.5; }
.error-msg { display: none; background: rgba(200,85,61,0.12); border: 1px solid rgba(200,85,61,0.3); border-radius: 10px; padding: 12px 14px; font-size: 12px; color: #e8a394; margin-top: 10px; }
.error-msg.show { display: block; }
.success-msg { display: none; background: rgba(91,138,114,0.15); border: 1px solid rgba(91,138,114,0.3); border-radius: 10px; padding: 12px 14px; font-size: 12px; color: #a8c9b5; margin-top: 10px; }
.success-msg.show { display: block; }
.recent-list { display: flex; flex-direction: column; gap: 1px; }
.recent-item {
  background: var(--paper); color: var(--ink);
  padding: 12px 16px; display: flex; align-items: center; gap: 12px;
}
.recent-item:first-child { border-radius: 14px 14px 0 0; }
.recent-item:last-child { border-radius: 0 0 14px 14px; }
.recent-item:only-child { border-radius: 14px; }
.recent-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.recent-info { flex: 1; min-width: 0; }
.recent-desc { font-size: 13px; font-weight: 500; }
.recent-meta { font-size: 10px; color: var(--text-soft); margin-top: 2px; }
.recent-amt { font-family: 'DM Mono', monospace; font-size: 13px; }
.recent-amt.income { color: var(--celadon); }
.recent-amt.expense { color: var(--vermillion); }
.section-title {
  font-family: 'Shippori Mincho', serif; font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
}
.section-title::before { content: ''; width: 4px; height: 14px; background: var(--gold); border-radius: 2px; }
</style>
<style>.picker-dialog-frame{width:100%;height:100%;border:0;overflow:hidden}.picker-dialog-bg{position:absolute;top:0;left:0;background-color:#fff;z-index:1000}.picker-dialog{position:absolute;top:0;left:0;background-color:#fff;border:1px solid #acacac;width:auto;padding:0;z-index:1001;overflow:auto;box-shadow:0 4px 16px rgba(0,0,0,.2)}.picker-dialog-content{height:100%;font-size:0;padding:0}.picker-dialog-buttons,.picker-dialog-title{display:none}</style></head>
<body>

<header>
  <div class="app-title"><span class="stamp">記</span>家計簿入力</div>
  <p>Googleスプレッドシートに直接保存</p>
</header>

<div class="main">

  <div class="security-note">
    <span class="icon">🔒</span>
    <span>確定した明細は、お使いのGoogleスプレッドシートに直接書き込まれます。写真・CSVを解析する際だけ、画像/テキストがAI解析のために送信されます。</span>
  </div>

  <!-- 入力方法タブ -->
  <div>
    <div class="input-tabs">
      <button class="input-tab active" data-panel="manual" onclick="switchTab(this)">✎ 手入力</button>
      <button class="input-tab" data-panel="photo" onclick="switchTab(this)">📷 写真</button>
      <button class="input-tab" data-panel="csv" onclick="switchTab(this)">📄 CSV</button>
    </div>

    <div class="input-panel active" id="panel-manual">
      <div class="type-toggle">
        <button class="type-btn expense active" id="typeExpenseBtn" onclick="setManualType(&#39;expense&#39;)">支出</button>
        <button class="type-btn income" id="typeIncomeBtn" onclick="setManualType(&#39;income&#39;)">収入</button>
      </div>
      <div class="form-row">
        <div class="form-field"><label>日付</label><input type="date" id="mDate"></div>
        <div class="form-field"><label>金額</label><input type="number" id="mAmount" placeholder="0"></div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>内容</label><input type="text" id="mDesc" placeholder="例：スーパー、給料など"></div>
        <div class="form-field"><label>カテゴリ</label><select id="mCategory"><option>食費</option><option>日用品</option><option>交通費</option><option>光熱費</option><option>通信費</option><option>医療費</option><option>住居費</option><option>保険</option><option>娯楽</option><option>教育</option><option>その他</option></select></div>
      </div>
      <button class="btn-submit" onclick="addManualEntry()">スプレッドシートに追加</button>
      <div class="success-msg" id="manualSuccess"></div>
      <div class="error-msg" id="manualError"></div>
    </div>

    <div class="input-panel" id="panel-photo">
      <button class="btn-drive" onclick="openDrivePicker()">📂 Googleドライブから選択</button>
      <div class="upload-zone" id="photoZone" style="margin-top:10px;">
        <input type="file" id="photoInput" accept="image/*">
        <div class="icon">📷</div>
        <h3>または写真を直接アップロード</h3>
        <p>レシート、クレカ明細、銀行アプリのスクショなど</p>
      </div>
      <div class="preview-row" id="photoPreview">
        <span>📎</span><span class="name" id="photoName"></span>
        <button onclick="clearPhoto()">✕</button>
      </div>
      <button class="btn-analyze" id="photoAnalyzeBtn" onclick="analyzePhoto()">🔍 読み取る</button>
      <div class="loading-inline" id="photoLoading"><div class="spinner-sm"></div>解析中...</div>
      <div class="error-msg" id="photoError"></div>
      <div class="review-list" id="photoReview"></div>
      <button class="btn-confirm-all" id="photoConfirmBtn" onclick="confirmReview(&#39;photo&#39;)">スプレッドシートに追加</button>
      <div class="success-msg" id="photoSuccess"></div>
    </div>

    <div class="input-panel" id="panel-csv">
      <select class="csv-bank" id="csvBank">
        <option value="自動判定">金融機関：自動判定</option>
        <option value="楽天銀行">楽天銀行</option>
        <option value="三菱UFJ銀行">三菱UFJ銀行</option>
        <option value="ゆうちょ銀行">ゆうちょ銀行</option>
        <option value="三井住友銀行">三井住友銀行</option>
        <option value="楽天カード">楽天カード</option>
        <option value="エポスカード">エポスカード</option>
        <option value="viewカード">viewカード</option>
        <option value="三井住友カード">三井住友カード</option>
      </select>
      <div class="upload-zone" id="csvZone">
        <input type="file" id="csvInput" accept=".csv,.txt">
        <div class="icon">📄</div>
        <h3>明細CSVファイル</h3>
        <p>銀行・カードサイトでダウンロードしたCSV</p>
      </div>
      <div class="preview-row" id="csvPreview">
        <span>📄</span><span class="name" id="csvName"></span>
        <button onclick="clearCSV()">✕</button>
      </div>
      <button class="btn-analyze" id="csvAnalyzeBtn" onclick="analyzeCSV()">🔍 読み取る</button>
      <div class="loading-inline" id="csvLoading"><div class="spinner-sm"></div>解析中...</div>
      <div class="error-msg" id="csvError"></div>
      <div class="review-list" id="csvReview"></div>
      <button class="btn-confirm-all" id="csvConfirmBtn" onclick="confirmReview(&#39;csv&#39;)">スプレッドシートに追加</button>
      <div class="success-msg" id="csvSuccess"></div>
    </div>
  </div>

  <!-- 直近の追加履歴 -->
  <div id="recentSection" style="display:none">
    <div class="section-title">今回のセッションで追加した明細</div>
    <div class="recent-list" id="recentList"></div>
  </div>

</div>

<script>
const CATEGORIES = {
  expense: ['食費','日用品','交通費','光熱費','通信費','医療費','住居費','保険','娯楽','教育','その他'],
  income: ['給与','ボーナス','副業','その他収入']
};
const CATEGORY_COLORS = {
  '食費':'#c8553d','日用品':'#b8923f','交通費':'#5b8a72','光熱費':'#8a6fb0',
  '通信費':'#4a8fb5','医療費':'#d4756b','住居費':'#7a6a52','保険':'#5f7a8a',
  '娯楽':'#c98a3f','教育':'#5f8a6a','その他':'#8a8478',
  '給与':'#5b8a72','ボーナス':'#4a8fb5','副業':'#b8923f','その他収入':'#8a8478'
};

// GAS WebApp URL（固定）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx8wxKyeppwQhrRWPyHOStAmSbBlwBYemVYFFb_en1mezZTHlFkFhJ7sjTbF7BSUGE8/exec';

// Google Picker設定
const GOOGLE_API_KEY = 'AIzaSyACUoVTzF-p11tpirudJzqBjEJ3mxZBLmQ';
const GOOGLE_CLIENT_ID = '958314442221-jqh28oakgll8goaih2r5cqmvd070k3im.apps.googleusercontent.com';

let manualType = 'expense';
let photoFile = null, csvFile = null;
let reviewData = { photo: [], csv: [] };
let recentEntries = [];
let accessToken = null;
let pickerInited = false;

// ===== 初期化 =====
function init() {
  document.getElementById('mDate').value = new Date().toISOString().slice(0,10);
  updateCategoryOptions();
  gapi.load('picker', () => { pickerInited = true; });
}

function updateCategoryOptions() {
  const sel = document.getElementById('mCategory');
  sel.innerHTML = CATEGORIES[manualType].map(c => `<option>${c}</option>`).join('');
}
function setManualType(type) {
  manualType = type;
  document.getElementById('typeExpenseBtn').classList.toggle('active', type==='expense');
  document.getElementById('typeIncomeBtn').classList.toggle('active', type==='income');
  updateCategoryOptions();
}
function switchTab(btn) {
  document.querySelectorAll('.input-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.input-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
}

// ===== GASへの送信（JSONP方式） =====
function sendToSheet(entries) {
  return new Promise((resolve, reject) => {
    const callbackName = 'gasCallback_' + Date.now();
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('応答がタイムアウトしました'));
    }, 15000);
    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[callbackName] = function(data) {
      cleanup();
      if (data && data.success) resolve(data);
      else reject(new Error((data && data.message) || '保存に失敗しました'));
    };
    const params = new URLSearchParams({
      entries: JSON.stringify(entries),
      callback: callbackName
    });
    const script = document.createElement('script');
    script.src = GAS_URL + '?' + params.toString();
    script.onerror = () => { cleanup(); reject(new Error('通信に失敗しました')); };
    document.body.appendChild(script);
  });
}

// ===== 手入力 =====
async function addManualEntry() {
  const amount = Number(document.getElementById('mAmount').value);
  const desc = document.getElementById('mDesc').value.trim();
  if (!amount || !desc) { alert('内容と金額を入力してください'); return; }
  const entry = {
    date: document.getElementById('mDate').value,
    description: desc,
    category: document.getElementById('mCategory').value,
    type: manualType,
    amount: amount
  };
  const btn = document.querySelector('.btn-submit');
  const successEl = document.getElementById('manualSuccess');
  const errorEl = document.getElementById('manualError');
  successEl.classList.remove('show'); errorEl.classList.remove('show');
  btn.disabled = true;
  try {
    await sendToSheet([entry]);
    successEl.textContent = '✅ スプレッドシートに追加しました';
    successEl.classList.add('show');
    addToRecent([entry]);
    document.getElementById('mAmount').value = '';
    document.getElementById('mDesc').value = '';
  } catch (err) {
    errorEl.textContent = 'エラー: ' + err.message;
    errorEl.classList.add('show');
  }
  btn.disabled = false;
}

// ===== Google Drive Picker =====
function openDrivePicker() {
  if (!accessToken) {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/drive.readonly',
      callback: (tokenResponse) => {
        accessToken = tokenResponse.access_token;
        createPicker();
      }
    });
    client.requestAccessToken();
  } else {
    createPicker();
  }
}

function createPicker() {
  if (!pickerInited) {
    alert('Pickerの初期化中です。少し待ってから再試行してください。');
    return;
  }
  const view = new google.picker.View(google.picker.ViewId.DOCS_IMAGES);
  const picker = new google.picker.PickerBuilder()
    .setTitle('スクショを選択')
    .addView(view)
    .setOAuthToken(accessToken)
    .setDeveloperKey(GOOGLE_API_KEY)
    .setCallback(pickerCallback)
    .build();
  picker.setVisible(true);
}

async function pickerCallback(data) {
  if (data.action === google.picker.Action.PICKED) {
    const file = data.docs[0];
    const response = await fetch(
      `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    const blob = await response.blob();
    photoFile = new File([blob], file.name, { type: file.mimeType });
    document.getElementById('photoName').textContent = file.name;
    document.getElementById('photoPreview').classList.add('show');
    document.getElementById('photoAnalyzeBtn').classList.add('show');
  }
}

// ===== 写真 =====
document.getElementById('photoInput').addEventListener('change', e => {
  if (e.target.files[0]) {
    photoFile = e.target.files[0];
    document.getElementById('photoName').textContent = photoFile.name;
    document.getElementById('photoPreview').classList.add('show');
    document.getElementById('photoAnalyzeBtn').classList.add('show');
  }
});
function clearPhoto() {
  photoFile = null;
  document.getElementById('photoInput').value = '';
  document.getElementById('photoPreview').classList.remove('show');
  document.getElementById('photoAnalyzeBtn').classList.remove('show');
  document.getElementById('photoReview').classList.remove('show');
  document.getElementById('photoConfirmBtn').classList.remove('show');
}

async function analyzePhoto() {
  if (!photoFile) return;
  document.getElementById('photoAnalyzeBtn').disabled = true;
  document.getElementById('photoLoading').classList.add('show');
  document.getElementById('photoError').classList.remove('show');
  try {
    const base64 = await fileToBase64(photoFile);
    const mediaType = photoFile.type || 'image/jpeg';
    const prompt = `この画像はレシート・クレジットカード明細・銀行アプリのスクリーンショットです。
全ての取引明細を読み取り、次のJSON形式のみで返してください（説明文不要）：
{"entries":[{"date":"2026-06-15","description":"店名・内容","category":"食費/日用品/交通費/光熱費/通信費/医療費/住居費/保険/娯楽/教育/給与/ボーナス/副業/その他収入/その他のいずれか","type":"expense または income","amount":1500}]}
日付が不明な場合は今日の日付(${new Date().toISOString().slice(0,10)})を使用。金額は数値のみ。`;
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: [
          { type: 'image', source: { type:'base64', media_type: mediaType, data: base64 } },
          { type: 'text', text: prompt }
        ]}]
      })
    });
    const data = await response.json();
    const text = data.content.map(i=>i.text||'').join('');
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    reviewData.photo = parsed.entries || [];
    document.getElementById('photoLoading').classList.remove('show');
    if (!reviewData.photo.length) {
      showError('photoError', '明細を検出できませんでした。別の画像をお試しください。');
    } else {
      renderReview('photo');
    }
  } catch(err) {
    document.getElementById('photoLoading').classList.remove('show');
    showError('photoError', 'エラー: ' + err.message);
  }
  document.getElementById('photoAnalyzeBtn').disabled = false;
}

// ===== CSV =====
document.getElementById('csvInput').addEventListener('change', e => {
  if (e.target.files[0]) {
    csvFile = e.target.files[0];
    document.getElementById('csvName').textContent = csvFile.name;
    document.getElementById('csvPreview').classList.add('show');
    document.getElementById('csvAnalyzeBtn').classList.add('show');
  }
});
function clearCSV() {
  csvFile = null;
  document.getElementById('csvInput').value = '';
  document.getElementById('csvPreview').classList.remove('show');
  document.getElementById('csvAnalyzeBtn').classList.remove('show');
  document.getElementById('csvReview').classList.remove('show');
  document.getElementById('csvConfirmBtn').classList.remove('show');
}

async function analyzeCSV() {
  if (!csvFile) return;
  document.getElementById('csvAnalyzeBtn').disabled = true;
  document.getElementById('csvLoading').classList.add('show');
  document.getElementById('csvError').classList.remove('show');
  try {
    const text = await readCSVText(csvFile);
    const bankName = document.getElementById('csvBank').value;
    const prompt = `以下は${bankName}の取引明細CSVです。全取引を読み取り、次のJSON形式のみで返してください：
{"entries":[{"date":"2026-06-15","description":"内容","category":"食費/日用品/交通費/光熱費/通信費/医療費/住居費/保険/娯楽/教育/給与/ボーナス/副業/その他収入/その他のいずれか","type":"expense または income","amount":1500}]}
金額は正の数値のみ。CSV:
\`\`\`
${text.slice(0,8000)}
\`\`\``;
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await response.json();
    const rawText = data.content.map(i=>i.text||'').join('');
    const clean = rawText.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    reviewData.csv = parsed.entries || [];
    document.getElementById('csvLoading').classList.remove('show');
    if (!reviewData.csv.length) {
      showError('csvError', '取引データが見つかりませんでした。');
    } else {
      renderReview('csv');
    }
  } catch(err) {
    document.getElementById('csvLoading').classList.remove('show');
    showError('csvError', 'エラー: ' + err.message);
  }
  document.getElementById('csvAnalyzeBtn').disabled = false;
}

// ===== レビュー表示・確定 =====
function renderReview(kind) {
  const list = document.getElementById(kind + 'Review');
  const allCats = [...CATEGORIES.expense, ...CATEGORIES.income];
  list.innerHTML = reviewData[kind].map((e, i) => `
    <div class="review-item">
      <input type="date" value="${e.date}" onchange="reviewData['${kind}'][${i}].date=this.value" style="width:110px">
      <input type="text" class="desc-input" value="${escapeAttr(e.description)}" onchange="reviewData['${kind}'][${i}].description=this.value">
      <select onchange="reviewData['${kind}'][${i}].category=this.value">
        ${allCats.map(c=>`<option ${e.category===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <input type="number" class="amt-input" value="${e.amount}" onchange="reviewData['${kind}'][${i}].amount=Number(this.value)">
      <button class="remove-btn" onclick="removeReviewItem('${kind}', ${i})">✕</button>
    </div>
  `).join('');
  list.classList.add('show');
  document.getElementById(kind + 'ConfirmBtn').classList.add('show');
}
function removeReviewItem(kind, idx) {
  reviewData[kind].splice(idx, 1);
  renderReview(kind);
}

async function confirmReview(kind) {
  const btn = document.getElementById(kind + 'ConfirmBtn');
  const successEl = document.getElementById(kind + 'Success');
  btn.disabled = true;
  try {
    await sendToSheet(reviewData[kind]);
    successEl.textContent = `✅ ${reviewData[kind].length}件を送信しました。スプレッドシートをご確認ください`;
    successEl.classList.add('show');
    addToRecent(reviewData[kind]);
    reviewData[kind] = [];
    document.getElementById(kind+'Review').classList.remove('show');
    btn.classList.remove('show');
    if (kind === 'photo') clearPhoto();
    if (kind === 'csv') clearCSV();
  } catch (err) {
    showError(kind + 'Error', 'エラー: ' + err.message);
  }
  btn.disabled = false;
}

function addToRecent(entries) {
  entries.forEach(e => recentEntries.unshift(e));
  recentEntries = recentEntries.slice(0, 10);
  renderRecent();
}
function renderRecent() {
  if (!recentEntries.length) return;
  document.getElementById('recentSection').style.display = 'block';
  document.getElementById('recentList').innerHTML = recentEntries.map(e => `
    <div class="recent-item">
      <div class="recent-dot" style="background:${CATEGORY_COLORS[e.category]||'#999'}"></div>
      <div class="recent-info">
        <div class="recent-desc">${escapeHtml(e.description)}</div>
        <div class="recent-meta">${e.date} ・ ${e.category}</div>
      </div>
      <div class="recent-amt ${e.type}">${e.type==='income'?'+':'-'}¥${Number(e.amount).toLocaleString()}</div>
    </div>
  `).join('');
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
}
function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
function escapeAttr(str) { return String(str).replace(/"/g, '&quot;'); }

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function readCSVText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsText(file, 'Shift_JIS');
  });
}

init();
</script>


</body></html>
